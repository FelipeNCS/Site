<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Plataforma Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* BACKGROUND GLOW ORBS */
        .glow-orb-1 {
            position: absolute;
            top: -10%; left: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(111, 66, 251, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }
        .glow-orb-2 {
            position: absolute;
            bottom: -10%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(50px);
        }

        /* Auth Container */
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 16, 22, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02), 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 0%, #a0a5b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            margin: 0;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
        }
        .form-input:focus {
            border-color: rgba(111, 66, 251, 0.5);
            box-shadow: 0 0 0 4px rgba(111, 66, 251, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Submit Button */
        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #6f42fb 0%, #4a25be 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(111, 66, 251, 0.3);
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(111, 66, 251, 0.4);
        }

        /* Auth Footer */
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .auth-footer a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .auth-footer a:hover {
            color: #fff;
        }

        /* Back link */
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .back-link:hover {
            color: #fff;
            transform: translateX(-4px);
        }
        
        @media (max-width: 768px) {
            .auth-container {
                border-radius: 0;
                border: none;
                border-top: 1px solid rgba(255,255,255,0.05);
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .back-link {
                top: 16px;
                left: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <a href="sistemas.html" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Voltar
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Criar Conta</h1>
            <p class="auth-subtitle">Crie sua conta para iniciar o teste grátis ou assinar um plano.</p>
        </div>

        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label">Nome Completo</label>
                <input type="text" id="name-input" class="form-input" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label class="form-label">CPF ou CNPJ</label>
                <input type="text" id="cpf-input" class="form-input" placeholder="000.000.000-00" required>
            </div>
            <div class="form-group">
                <label class="form-label">E-mail</label>
                <input type="email" id="email-input" class="form-input" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" id="password-input" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn" id="submit-btn">Criar Conta</button>
        </form>

        <div class="auth-footer">
            Já tem uma conta? <a href="login.html">Fazer Login</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan') || '';
            const btn = document.getElementById('submit-btn');
            if (plan.includes('trial')) {
                btn.innerHTML = 'Criar Conta e Iniciar Teste';
            } else {
                btn.innerHTML = 'Criar Conta e Pagar';
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Processando...';
            btn.style.opacity = '0.7';

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const plan = urlParams.get('plan') || 'trial-basic';
                
                const name = document.getElementById('name-input').value;
                const documentVal = document.getElementById('cpf-input').value;
                const email = document.getElementById('email-input').value;
                const password = document.getElementById('password-input').value;

                // 1. Criar a Conta no Backend
                const authResponse = await fetch('http://localhost:3333/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        storeName: name + ' Store',
                        userName: name,
                        document: documentVal,
                        email: email,
                        password: password,
                        plan: plan
                    })
                });

                const authData = await authResponse.json();

                if (!authResponse.ok) {
                    alert('Erro: ' + (authData.error || 'Não foi possível criar a conta.'));
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                    return;
                }

                // 2. Conta criada com sucesso! Salva token
                localStorage.setItem('token', authData.token);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('tenantId', authData.tenant.id);

                // 3. Decide a rota
                if (plan.includes('trial')) {
                    alert('Conta de teste criada com sucesso! Você tem 7 dias grátis.');
                    window.location.href = 'area-cliente.html';
                } else {
                    btn.innerHTML = 'Gerando Pagamento Seguro...';
                    const payResponse = await fetch('http://localhost:3333/api/payments/checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tenantId: authData.tenant.id,
                            plan: plan,
                            email: email
                        })
                    });
                    
                    const payData = await payResponse.json();
                    if (payData.init_point) {
                        window.location.href = payData.init_point;
                    } else {
                        alert('Erro ao gerar pagamento.');
                        window.location.href = 'area-cliente.html';
                    }
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexão com o servidor local.');
                btn.innerHTML = 'Tentar Novamente';
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>

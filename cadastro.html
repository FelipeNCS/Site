    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* BACKGROUND GLOW ORBS */
        .glow-orb-1 {
            position: absolute;
            top: -10%; left: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(111, 66, 251, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }
        .glow-orb-2 {
            position: absolute;
            bottom: -10%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(50px);
        }

        /* Auth Container */
        .auth-container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 16, 22, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02), 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 16px;
        }
        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 0%, #a0a5b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            margin: 0;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 12px;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
        }
        .form-input:focus {
            border-color: rgba(111, 66, 251, 0.5);
            box-shadow: 0 0 0 4px rgba(111, 66, 251, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Error Card */
        .error-card {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit Button */
        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #6f42fb 0%, #4a25be 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(111, 66, 251, 0.3);
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(111, 66, 251, 0.4);
        }

        /* Auth Footer */
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .auth-footer a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .auth-footer a:hover {
            color: #fff;
        }

        /* Back link */
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .back-link:hover {
            color: #fff;
            transform: translateX(-4px);
        }
        
        @media (max-width: 768px) {
            .auth-container {
                border-radius: 0;
                border: none;
                border-top: 1px solid rgba(255,255,255,0.05);
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .back-link {
                top: 16px;
                left: 16px;
            }
        }

        /* OTP Modal */
        .otp-modal { display: none; flex-direction: column; }
        .otp-modal.active { display: flex; animation: slideUp 0.4s ease forwards; }
        .register-form.hidden { display: none; }
        .otp-inputs { display: flex; gap: 8px; justify-content: center; margin: 24px 0; }
        .otp-input { width: 40px; height: 48px; font-size: 1.5rem; text-align: center; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; }
        .otp-input:focus { border-color: rgba(111, 66, 251, 0.5); outline: none; box-shadow: 0 0 0 3px rgba(111, 66, 251, 0.2); }
    </style>
</head>
<body>

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <a href="sistemas.html" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Voltar
    </a>

    <div class="auth-container">
        <div id="register-section" class="register-form">
            <div class="auth-header">
                <h1 class="auth-title">Criar Conta</h1>
                <p class="auth-subtitle">Crie sua conta para iniciar o teste grátis ou assinar um plano.</p>
            </div>

            <div id="error-card" class="error-card" style="display: none;">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="error-message"></span>
            </div>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" id="name-input" class="form-input" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label class="form-label">CPF ou CNPJ</label>
                    <input type="text" id="cpf-input" class="form-input" placeholder="000.000.000-00" required oninput="formatCpfCnpj(this)" maxlength="18">
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" id="email-input" class="form-input" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" id="password-input" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn" id="submit-btn">Criar Conta</button>
            </form>

            <div class="auth-footer">
                Já tem uma conta? <a href="login.html">Fazer Login</a>
            </div>
        </div>

        <div id="otp-section" class="otp-modal">
            <div class="auth-header" style="margin-bottom: 0;">
                <h1 class="auth-title">Verifique seu E-mail</h1>
                <p class="auth-subtitle">Enviamos um código de 6 dígitos para <br><strong id="display-email" style="color:#7dd3fc;"></strong></p>
            </div>
            <div class="otp-inputs">
                <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp-2')" id="otp-1">
                <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp-3')" id="otp-2">
                <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp-4')" id="otp-3">
                <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp-5')" id="otp-4">
                <input type="text" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp-6')" id="otp-5">
                <input type="text" maxlength="1" class="otp-input" id="otp-6" onkeyup="checkEnter(event)">
            </div>
            <button type="button" class="auth-btn" id="verify-btn" onclick="verifyOTP()">Confirmar Código</button>
            <div class="auth-footer">
                <a href="#" onclick="backToRegister()">← Voltar e corrigir e-mail</a>
            </div>
        </div>
    </div>

    <script>
        // Inicializa o EmailJS
        (function(){
            emailjs.init({
                publicKey: "Uow5EobsFYol8R5ac",
            });
        })();

        let generatedCode = "";

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan') || '';
            const btn = document.getElementById('submit-btn');
            if (plan.includes('trial')) {
                btn.innerHTML = 'Criar Conta e Iniciar Teste';
            } else {
                btn.innerHTML = 'Criar Conta e Pagar';
            }
        });

        // Mascara de CPF / CNPJ
        function formatCpfCnpj(input) {
            let v = input.value.replace(/\D/g,"");
            if (v.length <= 11) {
                // CPF
                v = v.replace(/(\d{3})(\d)/,"$1.$2");
                v = v.replace(/(\d{3})(\d)/,"$1.$2");
                v = v.replace(/(\d{3})(\d{1,2})$/,"$1-$2");
            } else {
                // CNPJ
                v = v.replace(/^(\d{2})(\d)/,"$1.$2");
                v = v.replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3");
                v = v.replace(/\.(\d{3})(\d)/,".$1/$2");
                v = v.replace(/(\d{4})(\d)/,"$1-$2");
            }
            input.value = v;
        }

        // Validacao simples de CPF (Algoritmo Oficial)
        function validarCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g,'');
            if(cpf == '') return false;
            if (cpf.length != 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            let add = 0;
            for (let i=0; i < 9; i ++) add += parseInt(cpf.charAt(i)) * (10 - i);
            let rev = 11 - (add % 11);
            if (rev == 10 || rev == 11) rev = 0;
            if (rev != parseInt(cpf.charAt(9))) return false;
            add = 0;
            for (let i=0; i < 10; i ++) add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11);
            if (rev == 10 || rev == 11) rev = 0;
            if (rev != parseInt(cpf.charAt(10))) return false;
            return true;
        }

        async function handleRegister(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            
            const name = document.getElementById('name-input').value;
            const documentVal = document.getElementById('cpf-input').value;
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            const errorCard = document.getElementById('error-card');
            const errorMsg = document.getElementById('error-message');
            errorCard.style.display = 'none';

            // Valida CPF
            const digitsOnly = documentVal.replace(/\D/g,"");
            if (digitsOnly.length === 11 && !validarCPF(digitsOnly)) {
                errorMsg.innerText = "O CPF informado é inválido. Por favor, verifique.";
                errorCard.style.display = 'flex';
                return;
            }

            btn.innerHTML = 'Verificando...';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            try {
                // VERIFICA SE O E-MAIL/DOCUMENTO JÁ EXISTE ANTES DE ENVIAR O CÓDIGO
                const checkResponse = await fetch('https://backend.leadev.store/api/auth/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, document: documentVal })
                });

                if (!checkResponse.ok) {
                    const checkData = await checkResponse.json();
                    errorMsg.innerText = checkData.error || 'Este e-mail ou documento já está cadastrado.';
                    errorCard.style.display = 'flex';
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                    btn.disabled = false;
                    return;
                }
            } catch (err) {
                console.error("Erro na verificação de conta:", err);
                errorMsg.innerText = "Erro de conexão com o backend. Verifique se o servidor está online.";
                errorCard.style.display = 'flex';
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.disabled = false;
                return;
            }

            btn.innerHTML = 'Enviando código...';

            // Gera código de 6 digitos
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            try {
                // ENVIA O EMAIL JS
                await emailjs.send('service_ygdc60y', 'template_3valgwj', {
                    to_name: name,
                    to_email: email,
                    verification_code: generatedCode
                });

                // Mostra Modal de OTP
                document.getElementById('display-email').innerText = email;
                document.getElementById('register-section').classList.add('hidden');
                document.getElementById('otp-section').classList.add('active');
                
            } catch (err) {
                console.error("Erro EmailJS:", err);
                alert("Erro ao enviar o código de verificação para o e-mail. Verifique suas configurações.");
            } finally {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.disabled = false;
            }
        }

        // Funcoes do Modal de OTP
        function moveToNext(current, nextId) {
            if (current.value.length >= 1) {
                const next = document.getElementById(nextId);
                if (next) next.focus();
            }
        }
        function checkEnter(e) {
            if (e.key === 'Enter') verifyOTP();
        }
        function backToRegister() {
            document.getElementById('otp-section').classList.remove('active');
            document.getElementById('register-section').classList.remove('hidden');
            // Limpa os campos
            for (let i=1; i<=6; i++) {
                document.getElementById('otp-'+i).value = '';
            }
        }

        async function verifyOTP() {
            const btn = document.getElementById('verify-btn');
            const originalText = btn.innerHTML;
            
            let codeEntered = "";
            for (let i=1; i<=6; i++) {
                codeEntered += document.getElementById('otp-'+i).value;
            }

            if (codeEntered !== generatedCode) {
                alert("Código incorreto! Tente novamente.");
                return;
            }

            btn.innerHTML = 'Processando Cadastro...';
            btn.style.opacity = '0.7';

            // DADOS FINALIZADOS - Envia para o Backend
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const plan = urlParams.get('plan') || 'trial-basic';
                const name = document.getElementById('name-input').value;
                const documentVal = document.getElementById('cpf-input').value;
                const email = document.getElementById('email-input').value;
                const password = document.getElementById('password-input').value;

                // 1. Criar a Conta no Backend
                const authResponse = await fetch('https://backend.leadev.store/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        storeName: name + ' Store',
                        userName: name,
                        document: documentVal,
                        email: email,
                        password: password,
                        plan: plan
                    })
                });

                const authData = await authResponse.json();

                if (!authResponse.ok) {
                    alert('Erro: ' + (authData.error || 'Não foi possível criar a conta.'));
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                    return;
                }

                localStorage.setItem('token', authData.token);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('tenantId', authData.tenant.id);
                localStorage.setItem('plan', authData.tenant.plan);

                if (plan.includes('trial')) {
                    // Alert can be kept or removed; client-area handles it nicely now
                    window.location.href = 'area-cliente.html?status=registered&plan=' + plan + '&product=pdv&trial=true';
                } else {
                    btn.innerHTML = 'Gerando Pagamento Seguro...';
                    const payResponse = await fetch('https://backend.leadev.store/api/payments/checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tenantId: authData.tenant.id,
                            plan: plan,
                            email: email
                        })
                    });
                    
                    const payData = await payResponse.json();
                    if (payData.init_point) {
                        window.location.href = payData.init_point;
                    } else {
                        alert('Erro ao gerar pagamento.');
                        window.location.href = 'area-cliente.html';
                    }
                }
            } catch (err) {
                console.error(err);
                alert('O e-mail foi verificado com sucesso, mas ocorreu um erro de conexão com o nosso servidor Backend (API). Verifique se o backend está online e se as configurações do Coolify estão corretas.');
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
            }
        }
    </script>

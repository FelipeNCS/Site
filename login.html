<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plataforma Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* BACKGROUND GLOW ORBS */
        .glow-orb-1 {
            position: absolute;
            top: -10%; left: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(111, 66, 251, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }
        .glow-orb-2 {
            position: absolute;
            bottom: -10%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(50px);
        }

        /* Auth Container */
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 16, 22, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02), 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 0%, #a0a5b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            margin: 0;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
        }
        .form-input:focus {
            border-color: rgba(111, 66, 251, 0.5);
            box-shadow: 0 0 0 4px rgba(111, 66, 251, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Checkbox & Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            position: relative;
            padding-left: 28px;
            transition: color 0.3s;
        }
        .remember-me:hover {
            color: #fff;
        }
        .remember-me input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        .checkmark {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 18px;
            width: 18px;
            background-color: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            transition: all 0.3s;
        }
        .remember-me:hover input ~ .checkmark {
            border-color: rgba(111, 66, 251, 0.5);
        }
        .remember-me input:checked ~ .checkmark {
            background-color: #6f42fb;
            border-color: #6f42fb;
            box-shadow: 0 0 10px rgba(111, 66, 251, 0.4);
        }
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }
        .remember-me input:checked ~ .checkmark:after {
            display: block;
        }
        .remember-me .checkmark:after {
            left: 6px;
            top: 2px;
            width: 4px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .forgot-pwd {
            color: #7dd3fc;
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-pwd:hover {
            color: #fff;
        }

        /* Submit Button */
        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #6f42fb 0%, #4a25be 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(111, 66, 251, 0.3);
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(111, 66, 251, 0.4);
        }

        /* Auth Footer */
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .auth-footer a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .auth-footer a:hover {
            color: #fff;
        }

        /* Back link */
        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .back-link:hover {
            color: #fff;
            transform: translateX(-4px);
        }
        
        @media (max-width: 768px) {
            .auth-container {
                border-radius: 0;
                border: none;
                border-top: 1px solid rgba(255,255,255,0.05);
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .back-link {
                top: 16px;
                left: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <a href="sistemas.html" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Voltar
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Fazer Login</h1>
            <p class="auth-subtitle">Acesse sua conta para gerenciar seus sistemas.</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-input" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember-chk" checked>
                    <span class="checkmark"></span>
                    Salvar login
                </label>
                <a href="#" class="forgot-pwd">Esqueceu a senha?</a>
            </div>

            <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>

            <button type="submit" class="auth-btn">Entrar na Plataforma</button>
        </form>

        <div class="auth-footer">
            Não tem uma conta? <a href="cadastro.html">Criar Conta Grátis</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            // Verifica o token do Cloudflare Turnstile
            const formData = new FormData(e.target);
            const token = formData.get('cf-turnstile-response');
            if (!token) {
                alert("Por favor, resolva a verificação de segurança (Anti-bot).");
                return;
            }

            // Efeito visual de carregamento
            const btn = document.querySelector('.auth-btn');
            btn.innerHTML = 'Entrando...';
            btn.style.opacity = '0.7';

            setTimeout(() => {
                // Simula o login e redireciona para a Área do Cliente
                window.location.href = 'area-cliente.html';
            }, 1000);
        }
    </script>
</body>
</html>
